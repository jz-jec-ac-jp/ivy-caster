# ワークフローの名前
name: Notify Review Request to Discord

# ワークフローが実行されるタイミング
on:
  pull_request:
    types: [review_requested] # プルリクエストでレビューがリクエストされた時

# 実行される処理内容
jobs:
  notify:
    # 実行環境
    runs-on: ubuntu-latest
    steps:
      # ステップ1: GitHubユーザー名からDiscordユーザーIDを取得する
      - name: Get Discord User ID
        id: get_user_id
        run: |
          USER_MAP='${{ secrets.DISCORD_USER_MAP }}'
          GITHUB_USERNAME='${{ github.event.requested_reviewer.login }}'
          DISCORD_USER_ID=$(echo "$USER_MAP" | jq -r ".[\"$GITHUB_USERNAME\"]")
          echo "DISCORD_USER_ID=$DISCORD_USER_ID" >> $GITHUB_OUTPUT

      # ステップ2: Discordに通知を送信する
      - name: Send Notification to Discord
        if: steps.get_user_id.outputs.DISCORD_USER_ID != 'null'
        # envブロックをここに追加
        env:
          # プルリクエストのBodyを安全なJSON文字列に変換して環境変数に格納
          PR_BODY: ${{ toJSON(github.event.pull_request.body) }}
        run: |
          # 送信するJSONデータ（Embedオブジェクト）を組み立てます
          cat <<EOF > payload.json
          {
            "content": "<@${{ steps.get_user_id.outputs.DISCORD_USER_ID }}> さん、レビューをお願いします！\\nプルリクエストがレビュー待ちです。内容の確認をお願いします。",
            "embeds": [
              {
                "title": "${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})",
                "url": "${{ github.event.pull_request.html_url }}",
                "description": ${PR_BODY},
                "color": 3447003,
                "author": {
                  "name": "${{ github.event.pull_request.user.login }}",
                  "icon_url": "${{ github.event.pull_request.user.avatar_url }}"
                }
              }
            ]
          }
          EOF

          # `curl`コマンドを使って、組み立てたJSONデータをファイルから読み込んで送信します
          curl -H "Content-Type: application/json" \
               -d @payload.json \
               "${{ secrets.DISCORD_WEBHOOK_URL }}"
